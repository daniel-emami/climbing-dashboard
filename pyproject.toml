[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climbing-dashboard"
version = "0.1.0"
description = "Excel-backed API and React dashboard for outdoor boulder ascents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "openpyxl>=3.1.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/ClimbingDashboard"]

[tool.hatch.build.targets.wheel.sources]
"backend" = ""

[tool.hatch.build.targets.sdist]
include = [
  "/backend/ClimbingDashboard",
  "/README.md",
  "/pyproject.toml",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
